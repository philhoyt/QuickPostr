name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Floor matches "Requires PHP: 8.1" in the plugin header.
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit

      - name: Lint (phpcs)
        run: composer run lint

      - name: Static analysis (phpstan)
        run: composer run analyse

      - name: Unit tests
        run: composer run test

  integration:
    name: WordPress integration
    runs-on: ubuntu-latest

    env:
      # Secrets are not readable in a step's `if`; an env var is.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Only for composer install: the suite itself runs inside wp-env on
          # the plugin's minimum PHP (see .wp-env.phpunit.json).
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        # register_block_type() is pointed at build/, which is gitignored. Without
        # a build WordPress cannot find block.json, falls back to treating the
        # path as a block name, and no blocks register.
        run: npm run build

      - name: Log in to Docker Hub
        # wp-env pulls its base images (wordpress, wordpress:cli, mariadb,
        # phpmyadmin) on every run. Anonymous pulls share a per-IP rate limit
        # across all GitHub runners and sometimes hit it before a test runs.
        # Authenticated pulls get a far higher limit. Skipped when the secret
        # is absent, such as on pull requests from forks, so the job still runs.
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the PHPUnit WordPress environment
        # Pinned to WordPress 7.1.3 in .wp-env.phpunit.json so a WordPress
        # release cannot turn CI red on an unrelated PR. wp-env ships the core
        # test library and sets WP_TESTS_DIR inside the container.
        run: npm run env:phpunit:start

      - name: Integration tests
        run: npm run test:php:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    env:
      # Secrets are not readable in a step's `if`; an env var is.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Log in to Docker Hub
        # wp-env pulls its base images (wordpress, wordpress:cli, mariadb,
        # phpmyadmin) on every run. Anonymous pulls share a per-IP rate limit
        # across all GitHub runners and sometimes hit it before a test runs.
        # Authenticated pulls get a far higher limit. Skipped when the secret
        # is absent, such as on pull requests from forks, so the job still runs.
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the WordPress environment
        run: npm run env:start

      - name: Show environment state
        # Makes a wrong mount or an inactive plugin visible in the log
        # instead of surfacing as "element not found" in every spec.
        run: |
          npx wp-env run cli wp plugin list --fields=name,status,version
          npx wp-env run cli wp eval 'echo "composer block registered: ", var_export( WP_Block_Type_Registry::get_instance()->is_registered( "quickpostr/composer" ), true ), PHP_EOL;'
          npx wp-env run cli wp option get permalink_structure

      - name: End-to-end tests
        # wp-scripts runs `playwright install` for every browser unless told
        # not to; Chromium is already installed with its system deps above.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  js:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with the release workflow.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
